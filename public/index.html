<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Bloomy Residences | Mar Mikhael, Beirut</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="night-mode">
  <div class="stars"></div>

  <!-- Header -->
  <header class="luxury-header">
    <div class="brand">
      <span class="brand-sub">SERVICED APARTMENTS · MAR MIKHAEL, BEIRUT</span>
      <h1 class="brand-title">THE BLOOMY RESIDENCES</h1>
    </div>
    <div class="header-controls">
      <span class="superhost-badge">★ Airbnb Superhost · Dalloul</span>
      <div class="mode-toggles">
        <button id="btn-night" class="mode-btn active" title="Night View">🌙 Night</button>
        <button id="btn-twilight" class="mode-btn" title="Dusk View">🌆 Twilight</button>
        <button id="btn-all-lights" class="mode-btn" title="Turn all lights on/off">💡 All Lights</button>
      </div>
    </div>
  </header>

  <!-- Interactive Building Stage -->
  <main class="stage-container">
    <div class="building-wrapper" id="building-wrapper">
      <img src="building.png" alt="The Bloomy Building Facade" class="facade-img" id="facade-img">
      <!-- Windows overlay container rendered dynamically by app.js -->
      <div class="windows-layer" id="windows-layer"></div>
    </div>
    <div class="street-ground"></div>
  </main>

  <!-- Room Gallery Lightbox Modal -->
  <div class="modal-overlay" id="gallery-modal" aria-hidden="true">
    <div class="modal-dialog">
      <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
      
      <div class="modal-gallery">
        <div class="main-image-container">
          <img id="modal-img" src="" alt="Apartment Photo">
          <button class="nav-btn prev-btn" id="prev-btn" aria-label="Previous image">&#10094;</button>
          <button class="nav-btn next-btn" id="next-btn" aria-label="Next image">&#10095;</button>
          <div class="photo-counter" id="photo-counter">1 / 1</div>
        </div>
        <div class="thumbnail-strip" id="thumbnail-strip"></div>
      </div>

      <div class="modal-sidebar">
        <div class="apt-meta">
          <span class="floor-tag" id="modal-floor">Floor 1</span>
          <h2 class="apt-title" id="modal-title">The Bloomy</h2>
          <p class="apt-location">📍 Mar Mikhael, Beirut &bull; Self Check-in</p>
          <div class="amenities-tags">
            <span>⚡ 24/7 Electricity</span>
            <span>📶 High-Speed WiFi</span>
            <span>❄ AC / Climate</span>
            <span>🍳 Kitchen</span>
          </div>
        </div>
        <div class="modal-cta">
          <a id="modal-whatsapp-link" href="https://wa.me/9613080141" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
            Chat on WhatsApp
          </a>
          <a id="modal-airbnb-link" href="#" target="_blank" rel="noopener noreferrer" class="airbnb-btn">
            <svg viewBox="0 0 32 32" width="20" height="20" fill="currentColor"><path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.18 12.515 6.18 16.706 0 5.466-4.249 10-11.464 10C8.784 32 4.536 27.466 4.536 22c0-4.191 4.226-12.876 6.18-16.706l.533-1.025C12.537 1.963 13.992 1 16 1zm0 2c-1.258 0-2.316.657-3.328 2.473L12.14 6.5C10.25 10.207 6.536 18.064 6.536 22c0 4.196 3.197 8 9.464 8s9.464-3.804 9.464-8c0-3.936-3.714-11.793-5.604-15.5l-.532-1.027C18.316 3.657 17.258 3 16 3zm0 11a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
            Book on Airbnb
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
